version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mafia
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "54321:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mafia-game

networks:
  mafia-game:
    driver: bridge

volumes:
  db-data:
